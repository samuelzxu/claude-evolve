[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-evolve"
version = "0.3.0"
description = "Evolutionary code discovery using Claude Code models"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
viz = [
    "matplotlib>=3.7.0",
]

[project.scripts]
claude-evolve = "claude_evolve.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_evolve*"]
